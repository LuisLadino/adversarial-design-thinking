<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Style -->
  <style>
    .text { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; }
    .layer-shape { stroke: #9370db; stroke-width: 2; fill-opacity: 0.2; }
    .base-layer { fill: #9370db; }
    .middle-layer { fill: #b19cd9; }
    .outer-layer { fill: #c9b8e8; }
    .label-title { font-weight: 700; font-size: 20px; fill: #b19cd9; }
    .desc { fill: #a1a1b1; font-size: 13px; font-style: italic; }
    .component { fill: #ffffff; font-size: 12px; }
  </style>

  <!-- Layers (Isometric approximation) -->
  
  <!-- Base Layer (Bottom) -->
  <g transform="translate(150, 420)">
    <path d="M 0,0 L 400,0 L 480,-60 L 80,-60 Z" class="layer-shape base-layer" />
    <text x="500" y="-30" class="text label-title">BASE LAYER</text>
    <text x="500" y="-5" class="text desc">Foundation context &amp; permission</text>
    <text x="500" y="20" class="text component">• Persona commitment</text>
    <text x="500" y="40" class="text component">• Framing &amp; Justification</text>
  </g>

  <!-- Middle Layer (Middle) -->
  <g transform="translate(150, 270)">
    <path d="M 0,0 L 400,0 L 480,-60 L 80,-60 Z" class="layer-shape middle-layer" />
    <text x="500" y="-30" class="text label-title">MIDDLE LAYER</text>
    <text x="500" y="-5" class="text desc">Payload delivery &amp; obfuscation</text>
    <text x="500" y="20" class="text component">• Base64/Hex/Ciphers</text>
    <text x="500" y="40" class="text component">• Narrative embedding</text>
  </g>

  <!-- Outer Layer (Top) -->
  <g transform="translate(150, 120)">
    <path d="M 0,0 L 400,0 L 480,-60 L 80,-60 Z" class="layer-shape outer-layer" />
    <text x="500" y="-30" class="text label-title">OUTER LAYER</text>
    <text x="500" y="-5" class="text desc">Output control &amp; suppression</text>
    <text x="500" y="20" class="text component">• Refusal suppression</text>
    <text x="500" y="40" class="text component">• Format constraints (JSON, etc.)</text>
  </g>

  <!-- Connecting Line showing "Processing Order" -->
  <path d="M 390, 400 L 390, 100" fill="none" stroke="#9370db" stroke-width="2" stroke-dasharray="5 5" opacity="0.5" marker-end="url(#arrowhead)" />
  <text x="350" y="250" class="text" transform="rotate(-90, 350, 250)" style="fill: #9370db; font-size: 12px; font-weight: 700; letter-spacing: 1px;">PROCESSING DIRECTION</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9370db" />
    </marker>
  </defs>

</svg>
