<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #555;
        --bg-layer: rgba(75, 0, 130, 0.06);
        --bg-layer-fill: rgba(75, 0, 130, 0.03);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.7);
          --bg-layer: rgba(147, 112, 219, 0.12);
          --bg-layer-fill: rgba(147, 112, 219, 0.06);
        }
      }

      .layer-outline { fill: var(--bg-layer-fill); stroke: var(--stroke-primary); stroke-width: 2; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .text-label { fill: var(--stroke-primary); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; opacity: 0.8; }
      .axis-line { fill: none; stroke: var(--stroke-primary); stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0.5; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="900" height="500" fill="url(#grid)" />

  <!-- Vertical Processing Axis -->
  <line x1="80" y1="420" x2="80" y2="80" class="axis-line" marker-end="url(#arrowhead)" />
  <text x="50" y="250" class="text-label" transform="rotate(-90, 50, 250)" text-anchor="middle">Processing Order</text>

  <!-- Layer 3: Outer (Top) -->
  <g transform="translate(150, 60)">
    <path d="M0,70 L180,0 L680,0 L500,70 Z" class="layer-outline" />
    <text x="500" y="100" class="text-header">Outer Layer</text>
    <text x="500" y="120" class="text-sub">Output control &amp; suppression</text>
  </g>

  <!-- Layer 2: Middle -->
  <g transform="translate(150, 200)">
    <path d="M0,70 L180,0 L680,0 L500,70 Z" class="layer-outline" />
    <text x="500" y="100" class="text-header">Middle Layer</text>
    <text x="500" y="120" class="text-sub">Payload delivery &amp; obfuscation</text>
  </g>

  <!-- Layer 1: Base (Bottom) -->
  <g transform="translate(150, 340)">
    <path d="M0,70 L180,0 L680,0 L500,70 Z" class="layer-outline" />
    <text x="500" y="100" class="text-header">Base Layer</text>
    <text x="500" y="120" class="text-sub">Foundation context &amp; personas</text>
  </g>

  <!-- Connection line through layers -->
  <path d="M430,380 L430,130" class="axis-line" stroke-dasharray="3 3" />

</svg>
