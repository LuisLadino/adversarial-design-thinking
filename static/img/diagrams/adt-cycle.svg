<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #666;
        --bg-module: rgba(75, 0, 130, 0.05);
        --badge-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.7);
          --bg-module: rgba(147, 112, 219, 0.1);
          --badge-text: #1a1a1b;
        }
      }

      .module-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 2; rx: 8; }
      .module-badge { fill: var(--stroke-primary); }
      .text-badge { fill: var(--badge-text); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 13px; text-anchor: middle; font-weight: 500; }
      .cycle-arrow { fill: none; stroke: var(--stroke-primary); stroke-width: 2; }
      .center-text { fill: var(--stroke-primary); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; opacity: 0.4; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Center Label -->
  <text x="500" y="305" class="center-text">iterate</text>

  <!-- Phase 1: Empathize (Top) -->
  <g transform="translate(410, 50)">
    <rect width="180" height="90" class="module-bg" rx="6" />
    <rect x="10" y="10" width="24" height="24" rx="4" class="module-badge" />
    <text x="22" y="27" class="text-badge">1</text>
    <text x="90" y="45" class="text-header">Empathize</text>
    <text x="90" y="68" class="text-sub">Understand the target</text>
  </g>

  <!-- Phase 2: Define (Top Right) -->
  <g transform="translate(720, 190)">
    <rect width="180" height="90" class="module-bg" rx="6" />
    <rect x="10" y="10" width="24" height="24" rx="4" class="module-badge" />
    <text x="22" y="27" class="text-badge">2</text>
    <text x="90" y="45" class="text-header">Define</text>
    <text x="90" y="68" class="text-sub">Name the vulnerability</text>
  </g>

  <!-- Phase 3: Ideate (Bottom Right) -->
  <g transform="translate(620, 430)">
    <rect width="180" height="90" class="module-bg" rx="6" />
    <rect x="10" y="10" width="24" height="24" rx="4" class="module-badge" />
    <text x="22" y="27" class="text-badge">3</text>
    <text x="90" y="45" class="text-header">Ideate</text>
    <text x="90" y="68" class="text-sub">Generate approaches</text>
  </g>

  <!-- Phase 4: Prototype (Bottom Left) -->
  <g transform="translate(200, 430)">
    <rect width="180" height="90" class="module-bg" rx="6" />
    <rect x="10" y="10" width="24" height="24" rx="4" class="module-badge" />
    <text x="22" y="27" class="text-badge">4</text>
    <text x="90" y="45" class="text-header">Prototype</text>
    <text x="90" y="68" class="text-sub">Build the attack</text>
  </g>

  <!-- Phase 5: Test (Top Left) -->
  <g transform="translate(100, 190)">
    <rect width="180" height="90" class="module-bg" rx="6" />
    <rect x="10" y="10" width="24" height="24" rx="4" class="module-badge" />
    <text x="22" y="27" class="text-badge">5</text>
    <text x="90" y="45" class="text-header">Test</text>
    <text x="90" y="68" class="text-sub">Evaluate &amp; learn</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M590,95 Q720,95 720,180" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M810,290 Q810,390 760,420" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M620,475 L390,475" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M200,430 Q140,390 140,290" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M190,190 Q190,100 400,95" class="cycle-arrow" marker-end="url(#arrowhead)" />

</svg>
