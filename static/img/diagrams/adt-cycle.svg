<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #444950;
        --bg-module: rgba(75, 0, 130, 0.03);
        --badge-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.6);
          --bg-module: rgba(147, 112, 219, 0.05);
          --badge-text: #1a1a1b;
        }
      }

      .module-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 1.5; }
      .badge { fill: var(--stroke-primary); }
      .badge-text { fill: var(--badge-text); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.1em; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 12px; text-anchor: middle; font-weight: 500; }
      .text-center { fill: var(--stroke-primary); font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.5; text-anchor: middle; }
      .cycle-arrow { fill: none; stroke: var(--stroke-primary); stroke-width: 2; }
      .center-ring { fill: none; stroke: var(--stroke-primary); stroke-width: 1; stroke-dasharray: 5 5; opacity: 0.4; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>

    <!-- Clip path for badge to match box corner -->
    <clipPath id="boxClip">
      <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" />
    </clipPath>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Center Hub -->
  <circle cx="500" cy="300" r="70" class="center-ring" />
  <text x="500" y="305" class="text-center">iterate</text>

  <!-- Phase 01: Empathize (Top) -->
  <g transform="translate(410, 50)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <g clip-path="url(#boxClip)">
      <rect x="0" y="0" width="38" height="20" class="badge" />
    </g>
    <text x="19" y="10" class="badge-text">01</text>
    <text x="90" y="52" class="text-header">Empathize</text>
    <text x="90" y="72" class="text-sub">Understand the target</text>
  </g>

  <!-- Phase 02: Define (Right) -->
  <g transform="translate(700, 200)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <g clip-path="url(#boxClip)">
      <rect x="0" y="0" width="38" height="20" class="badge" />
    </g>
    <text x="19" y="10" class="badge-text">02</text>
    <text x="90" y="52" class="text-header">Define</text>
    <text x="90" y="72" class="text-sub">Name the vulnerability</text>
  </g>

  <!-- Phase 03: Ideate (Bottom Right) -->
  <g transform="translate(600, 430)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <g clip-path="url(#boxClip)">
      <rect x="0" y="0" width="38" height="20" class="badge" />
    </g>
    <text x="19" y="10" class="badge-text">03</text>
    <text x="90" y="52" class="text-header">Ideate</text>
    <text x="90" y="72" class="text-sub">Generate approaches</text>
  </g>

  <!-- Phase 04: Prototype (Bottom Left) -->
  <g transform="translate(220, 430)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <g clip-path="url(#boxClip)">
      <rect x="0" y="0" width="38" height="20" class="badge" />
    </g>
    <text x="19" y="10" class="badge-text">04</text>
    <text x="90" y="52" class="text-header">Prototype</text>
    <text x="90" y="72" class="text-sub">Build the attack</text>
  </g>

  <!-- Phase 05: Test (Left) -->
  <g transform="translate(120, 200)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <g clip-path="url(#boxClip)">
      <rect x="0" y="0" width="38" height="20" class="badge" />
    </g>
    <text x="19" y="10" class="badge-text">05</text>
    <text x="90" y="52" class="text-header">Test</text>
    <text x="90" y="72" class="text-sub">Evaluate &amp; learn</text>
  </g>

  <!-- Flow Arrows - balanced curves -->
  <!-- 1→2: Empathize (right) to Define (top) -->
  <path d="M590,100 C660,100 700,140 700,190" class="cycle-arrow" marker-end="url(#arrowhead)" />

  <!-- 2→3: Define (bottom) to Ideate (right) -->
  <path d="M790,300 C790,370 760,420 690,430" class="cycle-arrow" marker-end="url(#arrowhead)" />

  <!-- 3→4: Ideate (left) to Prototype (right) -->
  <path d="M600,480 C520,480 480,480 410,480" class="cycle-arrow" marker-end="url(#arrowhead)" />

  <!-- 4→5: Prototype (top) to Test (bottom) -->
  <path d="M310,430 C310,370 300,310 300,300" class="cycle-arrow" marker-end="url(#arrowhead)" />

  <!-- 5→1: Test (top) to Empathize (left) -->
  <path d="M210,200 C210,140 340,100 400,100" class="cycle-arrow" marker-end="url(#arrowhead)" />

</svg>
