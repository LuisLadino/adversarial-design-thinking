<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Design Tokens -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      :root {
        --stroke-primary: #4b0082;
        --stroke-accent: #2d333b;
        --text-primary: #1a1a1b;
        --text-secondary: #444950;
        --bg-module: rgba(75, 0, 130, 0.03);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --stroke-accent: #ffffff;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.6);
          --bg-module: rgba(147, 112, 219, 0.05);
        }
      }

      .module-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 1.5; }
      .module-accent { fill: var(--stroke-primary); }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.1em; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 12px; text-anchor: middle; font-weight: 500; }
      .text-mono { fill: var(--stroke-primary); font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.7; }
      .cycle-arrow { fill: none; stroke: var(--stroke-primary); stroke-width: 2.5; stroke-dasharray: 4 2; }
      .center-ring { fill: none; stroke: var(--stroke-primary); stroke-width: 1; stroke-dasharray: 5 5; opacity: 0.5; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Center Hub -->
  <circle cx="500" cy="300" r="80" class="center-ring" />
  <circle cx="500" cy="300" r="60" class="center-ring" stroke-dasharray="2 2" />
  <text x="500" y="295" class="text-header" style="font-size: 24px; opacity: 0.2;">ADT</text>
  <text x="500" y="320" class="text-mono">CYCLE_v2.0</text>

  <!-- Phase 01: Empathize (Top) -->
  <g transform="translate(410, 40)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <rect x="0" y="0" width="40" height="15" class="module-accent" />
    <text x="20" y="11" class="text-mono" style="fill: var(--stroke-accent);">01</text>
    <text x="90" y="50" class="text-header">Empathize</text>
    <text x="90" y="70" class="text-sub">Understand the target</text>
  </g>

  <!-- Phase 02: Define (Top Right) -->
  <g transform="translate(720, 180)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <rect x="0" y="0" width="40" height="15" class="module-accent" />
    <text x="20" y="11" class="text-mono" style="fill: var(--stroke-accent);">02</text>
    <text x="90" y="50" class="text-header">Define</text>
    <text x="90" y="70" class="text-sub">Name the vulnerability</text>
  </g>

  <!-- Phase 03: Ideate (Bottom Right) -->
  <g transform="translate(620, 440)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <rect x="0" y="0" width="40" height="15" class="module-accent" />
    <text x="20" y="11" class="text-mono" style="fill: var(--stroke-accent);">03</text>
    <text x="90" y="50" class="text-header">Ideate</text>
    <text x="90" y="70" class="text-sub">Generate approaches</text>
  </g>

  <!-- Phase 04: Prototype (Bottom Left) -->
  <g transform="translate(200, 440)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <rect x="0" y="0" width="40" height="15" class="module-accent" />
    <text x="20" y="11" class="text-mono" style="fill: var(--stroke-accent);">04</text>
    <text x="90" y="50" class="text-header">Prototype</text>
    <text x="90" y="70" class="text-sub">Test the attack</text>
  </g>

  <!-- Phase 05: Test & Iterate (Top Left) -->
  <g transform="translate(100, 180)">
    <path d="M0,10 L10,0 L170,0 L180,10 L180,90 L170,100 L10,100 L0,90 Z" class="module-bg" />
    <rect x="0" y="0" width="40" height="15" class="module-accent" />
    <text x="20" y="11" class="text-mono" style="fill: var(--stroke-accent);">05</text>
    <text x="90" y="50" class="text-header">Test</text>
    <text x="90" y="70" class="text-sub">Evaluate &amp; learn</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M600,90 Q750,90 800,170" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M810,290 Q810,400 750,440" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M610,490 L390,490" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M250,440 Q190,400 190,290" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <path d="M200,170 Q250,90 400,90" class="cycle-arrow" marker-end="url(#arrowhead)" />

</svg>
