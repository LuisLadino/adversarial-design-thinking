<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #555;
        --bg-module: rgba(75, 0, 130, 0.06);
        --badge-bg: #4b0082;
        --badge-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.7);
          --bg-module: rgba(147, 112, 219, 0.1);
          --badge-bg: #b19cd9;
          --badge-text: #1a1a1b;
        }
      }

      .module-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 2; }
      .badge { fill: var(--badge-bg); }
      .badge-text { fill: var(--badge-text); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 12px; text-anchor: middle; font-weight: 500; }
      .text-center { fill: var(--stroke-primary); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; opacity: 0.4; }
      .cycle-arrow { fill: none; stroke: var(--stroke-primary); stroke-width: 2; }
      .center-ring { fill: none; stroke: var(--stroke-primary); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Center -->
  <circle cx="500" cy="300" r="70" class="center-ring" />
  <text x="500" y="305" class="text-center">iterate</text>

  <!-- Phase 1: Empathize (Top Center) -->
  <g transform="translate(410, 50)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="10" y="10" width="28" height="22" rx="4" class="badge" />
    <text x="24" y="26" class="badge-text">1</text>
    <text x="90" y="45" class="text-header">Empathize</text>
    <text x="90" y="65" class="text-sub">Understand the target</text>
  </g>

  <!-- Phase 2: Define (Top Right) -->
  <g transform="translate(700, 170)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="10" y="10" width="28" height="22" rx="4" class="badge" />
    <text x="24" y="26" class="badge-text">2</text>
    <text x="90" y="45" class="text-header">Define</text>
    <text x="90" y="65" class="text-sub">Name the vulnerability</text>
  </g>

  <!-- Phase 3: Ideate (Bottom Right) -->
  <g transform="translate(620, 420)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="10" y="10" width="28" height="22" rx="4" class="badge" />
    <text x="24" y="26" class="badge-text">3</text>
    <text x="90" y="45" class="text-header">Ideate</text>
    <text x="90" y="65" class="text-sub">Generate approaches</text>
  </g>

  <!-- Phase 4: Prototype (Bottom Left) -->
  <g transform="translate(200, 420)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="10" y="10" width="28" height="22" rx="4" class="badge" />
    <text x="24" y="26" class="badge-text">4</text>
    <text x="90" y="45" class="text-header">Prototype</text>
    <text x="90" y="65" class="text-sub">Build the attack</text>
  </g>

  <!-- Phase 5: Test (Top Left) -->
  <g transform="translate(120, 170)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="10" y="10" width="28" height="22" rx="4" class="badge" />
    <text x="24" y="26" class="badge-text">5</text>
    <text x="90" y="45" class="text-header">Test</text>
    <text x="90" y="65" class="text-sub">Evaluate &amp; learn</text>
  </g>

  <!-- Flow Arrows (symmetric curves) -->
  <!-- Empathize → Define -->
  <path d="M590,95 Q700,95 700,160" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <!-- Define → Ideate -->
  <path d="M790,270 Q790,380 760,410" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <!-- Ideate → Prototype -->
  <path d="M620,465 L390,465" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <!-- Prototype → Test -->
  <path d="M210,410 Q210,300 210,270" class="cycle-arrow" marker-end="url(#arrowhead)" />
  <!-- Test → Empathize -->
  <path d="M300,170 Q400,95 400,95" class="cycle-arrow" marker-end="url(#arrowhead)" />

</svg>
