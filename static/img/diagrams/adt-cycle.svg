<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #555;
        --bg-module: rgba(75, 0, 130, 0.06);
        --badge-bg: #4b0082;
        --badge-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.7);
          --bg-module: rgba(147, 112, 219, 0.1);
          --badge-bg: #b19cd9;
          --badge-text: #1a1a1b;
        }
      }

      .module-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 2; }
      .badge { fill: var(--badge-bg); }
      .badge-text { fill: var(--badge-text); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .text-sub { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 12px; text-anchor: middle; font-weight: 500; }
      .text-center { fill: var(--stroke-primary); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; opacity: 0.4; }
      .arrow { fill: none; stroke: var(--stroke-primary); stroke-width: 2; }
      .center-ring { fill: none; stroke: var(--stroke-primary); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--stroke-primary)" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Center -->
  <circle cx="500" cy="300" r="70" class="center-ring" />
  <text x="500" y="305" class="text-center">iterate</text>

  <!-- Phase 1: Empathize (Top Center) -->
  <g transform="translate(410, 50)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="12" y="12" width="26" height="26" rx="4" class="badge" />
    <text x="25" y="25" class="badge-text">1</text>
    <text x="90" y="50" class="text-header">Empathize</text>
    <text x="90" y="72" class="text-sub">Understand the target</text>
  </g>

  <!-- Phase 2: Define (Right) -->
  <g transform="translate(700, 205)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="12" y="12" width="26" height="26" rx="4" class="badge" />
    <text x="25" y="25" class="badge-text">2</text>
    <text x="90" y="50" class="text-header">Define</text>
    <text x="90" y="72" class="text-sub">Name the vulnerability</text>
  </g>

  <!-- Phase 3: Ideate (Bottom Right) -->
  <g transform="translate(600, 420)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="12" y="12" width="26" height="26" rx="4" class="badge" />
    <text x="25" y="25" class="badge-text">3</text>
    <text x="90" y="50" class="text-header">Ideate</text>
    <text x="90" y="72" class="text-sub">Generate approaches</text>
  </g>

  <!-- Phase 4: Prototype (Bottom Left) -->
  <g transform="translate(220, 420)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="12" y="12" width="26" height="26" rx="4" class="badge" />
    <text x="25" y="25" class="badge-text">4</text>
    <text x="90" y="50" class="text-header">Prototype</text>
    <text x="90" y="72" class="text-sub">Build the attack</text>
  </g>

  <!-- Phase 5: Test (Left) -->
  <g transform="translate(120, 205)">
    <rect width="180" height="90" rx="8" class="module-bg" />
    <rect x="12" y="12" width="26" height="26" rx="4" class="badge" />
    <text x="25" y="25" class="badge-text">5</text>
    <text x="90" y="50" class="text-header">Test</text>
    <text x="90" y="72" class="text-sub">Evaluate &amp; learn</text>
  </g>

  <!-- Flow Arrows - all curved beziers -->
  <!-- 1→2: Empathize to Define -->
  <path d="M590,100 C650,100 700,150 700,195" class="arrow" marker-end="url(#arrowhead)" />
  <!-- 2→3: Define to Ideate -->
  <path d="M790,305 C790,360 750,420 690,420" class="arrow" marker-end="url(#arrowhead)" />
  <!-- 3→4: Ideate to Prototype -->
  <path d="M600,465 C550,465 450,465 410,465" class="arrow" marker-end="url(#arrowhead)" />
  <!-- 4→5: Prototype to Test -->
  <path d="M220,420 C180,380 180,340 210,305" class="arrow" marker-end="url(#arrowhead)" />
  <!-- 5→1: Test to Empathize -->
  <path d="M210,195 C210,150 350,100 400,100" class="arrow" marker-end="url(#arrowhead)" />

</svg>
