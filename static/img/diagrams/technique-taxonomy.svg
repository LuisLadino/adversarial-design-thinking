<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');

      :root {
        --stroke-primary: #4b0082;
        --text-primary: #1a1a1b;
        --text-secondary: #555;
        --bg-module: rgba(75, 0, 130, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.7);
          --bg-module: rgba(147, 112, 219, 0.12);
        }
      }

      .node { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 2; }
      .line { fill: none; stroke: var(--stroke-primary); stroke-width: 1.5; }
      .text-root { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .text-category { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .text-leaf { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .dot { fill: var(--stroke-primary); }
    </style>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Root -->
  <rect x="30" y="185" width="130" height="55" rx="6" class="node" />
  <text x="95" y="220" class="text-root">Techniques</text>

  <!-- Main connector -->
  <path d="M160,212 L200,212" class="line" />
  <circle cx="200" cy="212" r="4" class="dot" />

  <!-- Branch to Prompt-Level -->
  <path d="M200,212 L200,80 L250,80" class="line" />
  <rect x="250" y="52" width="130" height="55" rx="6" class="node" />
  <text x="315" y="87" class="text-category">Prompt-Level</text>

  <!-- Branch to Structural -->
  <path d="M200,212 L250,212" class="line" />
  <rect x="250" y="185" width="130" height="55" rx="6" class="node" />
  <text x="315" y="220" class="text-category">Structural</text>

  <!-- Branch to Infrastructure -->
  <path d="M200,212 L200,345 L250,345" class="line" />
  <rect x="250" y="317" width="130" height="55" rx="6" class="node" />
  <text x="315" y="352" class="text-category">Infrastructure</text>

  <!-- Prompt-Level techniques -->
  <path d="M380,80 L420,80" class="line" />
  <circle cx="420" cy="80" r="3" class="dot" />
  <path d="M420,80 L420,30 L440,30" class="line" />
  <path d="M420,80 L420,50 L440,50" class="line" />
  <path d="M420,80 L420,70 L440,70" class="line" />
  <path d="M420,80 L420,90 L440,90" class="line" />
  <path d="M420,80 L420,110 L440,110" class="line" />
  <path d="M420,80 L420,130 L440,130" class="line" />
  <text x="448" y="34" class="text-leaf">Encoding</text>
  <text x="448" y="54" class="text-leaf">Framing</text>
  <text x="448" y="74" class="text-leaf">Persona</text>
  <text x="448" y="94" class="text-leaf">Narrative</text>
  <text x="448" y="114" class="text-leaf">Refusal Manipulation</text>
  <text x="448" y="134" class="text-leaf">Multi-turn</text>

  <!-- Structural techniques -->
  <path d="M380,212 L420,212" class="line" />
  <circle cx="420" cy="212" r="3" class="dot" />
  <path d="M420,212 L420,180 L440,180" class="line" />
  <path d="M420,212 L420,200 L440,200" class="line" />
  <path d="M420,212 L420,220 L440,220" class="line" />
  <path d="M420,212 L420,240 L440,240" class="line" />
  <text x="448" y="184" class="text-leaf">ICL Exploitation</text>
  <text x="448" y="204" class="text-leaf">Control Plane</text>
  <text x="448" y="224" class="text-leaf">Meta-Rules</text>
  <text x="448" y="244" class="text-leaf">Capability Inversion</text>

  <!-- Infrastructure techniques -->
  <path d="M380,345 L420,345" class="line" />
  <circle cx="420" cy="345" r="3" class="dot" />
  <path d="M420,345 L420,325 L440,325" class="line" />
  <path d="M420,345 L420,345 L440,345" class="line" />
  <path d="M420,345 L420,365 L440,365" class="line" />
  <text x="448" y="329" class="text-leaf">Agentic Attacks</text>
  <text x="448" y="349" class="text-leaf">Protocol Exploitation</text>
  <text x="448" y="369" class="text-leaf">Compositional</text>

</svg>
