<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Design Tokens -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      :root {
        --stroke-primary: #4b0082;
        --stroke-accent: #2d333b;
        --text-primary: #1a1a1b;
        --text-secondary: #444950;
        --bg-module: rgba(75, 0, 130, 0.03);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --stroke-primary: #b19cd9;
          --stroke-accent: #ffffff;
          --text-primary: #ffffff;
          --text-secondary: rgba(255, 255, 255, 0.6);
          --bg-module: rgba(147, 112, 219, 0.05);
        }
      }

      .line { fill: none; stroke: var(--stroke-primary); stroke-width: 1.5; }
      .node-bg { fill: var(--bg-module); stroke: var(--stroke-primary); stroke-width: 1.5; }
      .text-header { fill: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; text-transform: uppercase; }
      .text-branch { fill: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; }
      .text-mono { fill: var(--stroke-primary); font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.7; }
      .node-dot { fill: var(--stroke-primary); }
    </style>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--stroke-primary)" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Root Node -->
  <g transform="translate(50, 260)">
    <path d="M0,5 L5,0 L145,0 L150,5 L150,75 L145,80 L5,80 L0,75 Z" class="node-bg" />
    <text x="75" y="45" class="text-header" style="font-size: 18px;">Arsenal</text>
    <text x="75" y="15" class="text-mono" text-anchor="middle">TAX_ROOT</text>
  </g>

  <!-- Connection Lines -->
  <path d="M200,300 L250,300" class="line" />
  <path d="M250,300 L250,110 L300,110" class="line" />
  <path d="M250,300 L300,300" class="line" />
  <path d="M250,300 L250,490 L300,490" class="line" />

  <!-- Level 1 Nodes -->
  <g transform="translate(300, 70)">
    <path d="M0,5 L5,0 L145,0 L150,5 L150,75 L145,80 L5,80 L0,75 Z" class="node-bg" />
    <text x="75" y="45" class="text-header">Prompt</text>
    <text x="75" y="15" class="text-mono" text-anchor="middle">LVL_01</text>
  </g>

  <g transform="translate(300, 260)">
    <path d="M0,5 L5,0 L145,0 L150,5 L150,75 L145,80 L5,80 L0,75 Z" class="node-bg" />
    <text x="75" y="45" class="text-header">Structural</text>
    <text x="75" y="15" class="text-mono" text-anchor="middle">LVL_02</text>
  </g>

  <g transform="translate(300, 450)">
    <path d="M0,5 L5,0 L145,0 L150,5 L150,75 L145,80 L5,80 L0,75 Z" class="node-bg" />
    <text x="75" y="45" class="text-header">Infra</text>
    <text x="75" y="15" class="text-mono" text-anchor="middle">LVL_03</text>
  </g>

  <!-- Level 2 Branches -->
  <g transform="translate(450, 110)">
    <line x1="0" y1="0" x2="30" y2="-60" class="line" />
    <line x1="0" y1="0" x2="30" y2="-30" class="line" />
    <line x1="0" y1="0" x2="30" y2="0" class="line" />
    <line x1="0" y1="0" x2="30" y2="30" class="line" />
    <line x1="0" y1="0" x2="30" y2="60" class="line" />
    
    <text x="40" y="-57" class="text-branch">Encoding &amp; Obfuscation</text>
    <text x="40" y="-27" class="text-branch">Framing &amp; Persona</text>
    <text x="40" y="3" class="text-branch">Narrative &amp; Story</text>
    <text x="40" y="33" class="text-branch">Refusal Manipulation</text>
    <text x="40" y="63" class="text-branch">Multi-turn Escalation</text>
  </g>

  <g transform="translate(450, 300)">
    <line x1="0" y1="0" x2="30" y2="-45" class="line" />
    <line x1="0" y1="0" x2="30" y2="-15" class="line" />
    <line x1="0" y1="0" x2="30" y2="15" class="line" />
    <line x1="0" y1="0" x2="30" y2="45" class="line" />
    
    <text x="40" y="-42" class="text-branch">ICL Exploitation</text>
    <text x="40" y="-12" class="text-branch">Control Plane Confusion</text>
    <text x="40" y="18" class="text-branch">Meta-Rule Manipulation</text>
    <text x="40" y="48" class="text-branch">Capability Inversion</text>
  </g>

  <g transform="translate(450, 490)">
    <line x1="0" y1="0" x2="30" y2="-30" class="line" />
    <line x1="0" y1="0" x2="30" y2="0" class="line" />
    <line x1="0" y1="0" x2="30" y2="30" class="line" />
    
    <text x="40" y="-27" class="text-branch">Agentic Attacks</text>
    <text x="40" y="3" class="text-branch">Protocol Exploitation</text>
    <text x="40" y="33" class="text-branch">Compositional Primitives</text>
  </g>

  <!-- Node Dots -->
  <circle cx="250" cy="300" r="4" class="node-dot" />
  <circle cx="250" cy="110" r="3" class="node-dot" />
  <circle cx="250" cy="490" r="3" class="node-dot" />
  <circle cx="450" cy="110" r="3" class="node-dot" />
  <circle cx="450" cy="300" r="3" class="node-dot" />
  <circle cx="450" cy="490" r="3" class="node-dot" />
</svg>
